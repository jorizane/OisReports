services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      POSTGRES_USER: ois
      POSTGRES_PASSWORD: ois
      POSTGRES_DB: ois_reports
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    depends_on:
      - db

  db:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ois
      POSTGRES_PASSWORD: ois
      POSTGRES_DB: ois_reports
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
