<section class="change-password-panel">
  <header>
    <h1>Passwort ändern</h1>
    <p>Aktualisiere dein Admin-Passwort für den Zugriff auf die Anwendung.</p>
  </header>

  <form (ngSubmit)="submit()" class="change-password-form">
    <label class="field">
      <span>Aktuelles Passwort</span>
      <input type="password" name="currentPassword" [(ngModel)]="currentPassword" autocomplete="current-password" />
    </label>

    <label class="field">
      <span>Neues Passwort</span>
      <input type="password" name="newPassword" [(ngModel)]="newPassword" autocomplete="new-password" />
    </label>

    <label class="field">
      <span>Neues Passwort wiederholen</span>
      <input type="password" name="repeatPassword" [(ngModel)]="repeatPassword" autocomplete="new-password" />
    </label>

    <button type="submit" [disabled]="isLoading()">
      {{ isLoading() ? 'Speichern...' : 'Passwort speichern' }}
    </button>
  </form>

  <p class="error" *ngIf="errorMessage()">{{ errorMessage() }}</p>
  <p class="success" *ngIf="successMessage()">{{ successMessage() }}</p>
</section>
