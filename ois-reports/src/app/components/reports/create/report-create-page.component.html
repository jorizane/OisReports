<section class="panel">
  <header class="panel__header">
    <p class="eyebrow">Bericht erstellen</p>
    <h1>Prüffelder</h1>
    <p class="subtitle">
      Erfasse die Prüffelder für den Bericht.
    </p>
  </header>

  <p class="status status--error" *ngIf="errorMessage()">{{ errorMessage() }}</p>
  <p class="status" *ngIf="isLoading()">Prüffelder werden geladen...</p>

  <div class="context" *ngIf="customer()">
    <label class="field">
      <span class="field__label">Auftraggeber</span>
      <select
        class="field__input"
        name="clientId"
        [(ngModel)]="selectedClientId"
        disabled
      >
        <option *ngFor="let client of clients()" [ngValue]="client.id">
          {{ client.name }}
        </option>
      </select>
    </label>
    <label class="field">
      <span class="field__label">Kunde</span>
      <input class="field__input" type="text" [value]="customer()?.name" disabled />
    </label>
  </div>
  <div class="context" *ngIf="plant()">
    <label class="field">
      <span class="field__label">Filteranlage</span>
      <input
        class="field__input"
        type="text"
        [value]="plant()?.description"
        disabled
      />
    </label>
  </div>

  <div class="list" *ngIf="!isLoading()">
    <div class="list__row" *ngFor="let field of components(); trackBy: trackByComponentId">
      <div>
        <p class="list__name">
          {{ field.label }}
          <span *ngIf="field.unit">({{ field.unit }})</span>
        </p>
        <ng-container [ngSwitch]="field.field_type">
          <textarea
            *ngSwitchCase="'text'"
            class="field__textarea"
            rows="3"
            [(ngModel)]="field.value_text"
            [name]="'text-' + field.id"
            placeholder="Beschreibung eingeben"
          ></textarea>
          <input
            *ngSwitchCase="'number'"
            class="field__input"
            type="number"
            [(ngModel)]="field.value_number"
            [name]="'number-' + field.id"
            placeholder="Wert eingeben"
          />
          <div *ngSwitchCase="'radio'" class="radio-group">
            <label class="radio-option" *ngFor="let option of field.options">
              <input
                type="radio"
                [name]="'radio-' + field.id"
                [value]="option"
                [(ngModel)]="field.value_option"
              />
              <span>{{ option }}</span>
            </label>
          </div>
          <label *ngSwitchCase="'boolean'" class="checkbox">
            <input type="checkbox" [(ngModel)]="field.value_bool" [name]="'bool-' + field.id" />
            <span>Ja</span>
          </label>
        </ng-container>
      </div>
    </div>
  </div>

  <div class="actions" *ngIf="components().length > 0">
    <a class="ghost-link-button" [routerLink]="['/customers', customerId, 'filter-plants', plantId]">
      Zurück zur Filteranlage
    </a>
    <button class="primary-button" type="button" (click)="saveReport()">
      Bericht zwischenspeichern
    </button>
  </div>
</section>

<div class="modal modal--success" *ngIf="successMessage()">
  <div class="modal__overlay"></div>
  <div class="modal__content modal__content--success">
    <h2>Erfolg</h2>
    <p>{{ successMessage() }}</p>
    <div class="modal__actions">
      <button class="ghost-button" type="button" (click)="dismissSuccess()">OK</button>
    </div>
  </div>
</div>
